[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "shatranj"
version = "0.1.0"
description = "Shatranj (Indian Chess) game implementation in Python with AI, GUI, and network support"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "EL GHALI Ayman" },
    { name = "MARCHOUD Souhail" },
    { name = "MEKLAT Sarah" },
    { name = "DRIES Amina" },
    { name = "BENACHOUR Souhila" }
]

dependencies = [
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "flake8>=6.1.0",
    "isort>=5.12.0",
    "sphinx>=7.1.0",
]

[project.optional-dependencies]
gui = [
    "PyGObject>=3.42.0; sys_platform == 'linux'",
]
dev = []

[project.scripts]
shatranj = "shatranj.main:main"

[project.urls]
Repository = "https://gitlab.emi.u-bordeaux.fr/pdp-2026/shatranj-python"

[tool.setuptools.packages.find]
where = ["."]
include = ["shatranj*"]

[tool.pytest.ini_options]
addopts = "--cov=shatranj --cov-report=term-missing"